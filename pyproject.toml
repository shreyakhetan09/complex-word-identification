[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-word-identification"
version = "1.0.0"
description = "Classify words as simple or complex for lexical text simplification"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
features = ["nltk>=3.8", "syllables>=1.0"]

[tool.setuptools]
packages = ["cwi"]
